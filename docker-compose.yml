services:
  scramjet-plus:
    build: .
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${PORT:-8080}:8080"
    environment:
      AUTH_DATA_FILE: /app/data/users.json
      COOKIE_SECURE: "true"
      NODE_ENV: production
    volumes:
      - scramjet-data:/app/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1",
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  scramjet-data:
